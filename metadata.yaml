name: astrbot_plugin_profile_weaver
display_name: 心迹画像
short_desc: 安全可控的用户画像记忆，附带高设计感 WebUI 管理面板。
desc: >-
  心迹画像（Profile Weaver）以「只写当前说话人」为核心原则维护用户画像：LLM 只能通过显式工具写入并提供原文证据，
  配合身份护栏、字段写入黑名单、逐字段锁与完整审计日志。内置 Dashboard 管理面板（7 套主题、明暗自适应、
  键盘快捷键），支持画像完整度评分、字段级变更历史、审计 CSV 导出、导入导出迁移、每日自动备份与下载/恢复/删除、
  画像合并与统计，并支持每用户自定义字段。
help: >-
  用户命令：我的画像 / 画像字段 / 画像完整度 / 设置画像 <字段> <值> / 删除画像 <字段|备注序号> /
  锁定画像 <字段> / 解锁画像 <字段> / 画像历史 <字段> / 清空画像 / 画像帮助。
  管理员命令：查询画像 <用户|@某人> / 修改画像 <用户> <字段> <值> / 删除画像字段 <用户> <字段> /
  清空用户画像 <用户> / 锁定用户画像 <用户> <字段> / 解锁用户画像 <用户> <字段> /
  画像字段历史 <用户> <字段> / 画像审计 <用户> [条数] / 画像统计 / 画像备份 [标签] / 画像备份列表 /
  画像恢复备份 <文件名> / 合并画像 <源key> <目标key> / 画像面板。
  也可在 AstrBot Dashboard 的「心迹画像」页面里可视化浏览、编辑、锁定、查历史、导入导出与备份管理。
version: v3.1.0
author: Whereis-Alice
repo: https://github.com/Whereis-Alice/astrbot_plugin_profile_weaver
astrbot_version: ">=4.16,<5"
tags:
